<style>
/* ===== Themes: light (default) and dark. Every colour comes from these variables. ===== */
:root, html[data-theme="light"]{
  --bg:#F3F6F5; --panel:#FFFFFF; --panel2:#EEF3F1; --line:#E1E8E5; --text:#14211D; --muted:#66776F;
  --green:#11806A; --green2:#0C6B58; --greenSoft:rgba(17,128,106,.10); --onpri:#FFFFFF;
  --red:#D93A3A; --redSoft:rgba(217,58,58,.10); --amber:#C9790B; --amberSoft:rgba(201,121,11,.12);
  --blue:#2F6FD6; --blueSoft:rgba(47,111,214,.10);
  --accent:#D9825B; --accentSoft:rgba(217,130,91,.14); --navy:#1F3B4D; --c4:#9DB5AE;
  --greenTxt:#0B6E5A; --redTxt:#B42323; --amberTxt:#9A5B05; --blueTxt:#2459B3;
  --topbg:rgba(243,246,245,.88); --mine:#E3F3EE; --mineLine:#BFE3D7; --scrim:rgba(20,33,29,.45);
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.05); --r:14px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0B1210; --panel:#121B19; --panel2:#18231F; --line:#24322D; --text:#E6EEEA; --muted:#8B9C96;
  --green:#34C3A0; --green2:#22A585; --greenSoft:rgba(52,195,160,.13); --onpri:#04140F;
  --red:#F06A6A; --redSoft:rgba(240,106,106,.13); --amber:#F2B24C; --amberSoft:rgba(242,178,76,.13);
  --blue:#6EA8FE; --blueSoft:rgba(110,168,254,.13);
  --accent:#E59B74; --accentSoft:rgba(229,155,116,.15); --navy:#A9C6D6; --c4:#4E625C;
  --greenTxt:#5FD8B8; --redTxt:#F79A9A; --amberTxt:#F5C478; --blueTxt:#9CC3FF;
  --topbg:rgba(11,18,16,.86); --mine:#123A30; --mineLine:#1D5546; --scrim:rgba(0,0,0,.6);
  --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--green)}
.hidden{display:none!important}
/* icons: line icons drawn inline, they take the text colour */
.i{width:18px;height:18px;flex-shrink:0;vertical-align:-3px}
.i.lg{width:22px;height:22px}.i.xl{width:40px;height:40px;stroke-width:1.4}
html[dir="rtl"] .i.dir{transform:scaleX(-1)}
.chipi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--greenSoft);color:var(--green);flex-shrink:0}
.chipi.red{background:var(--redSoft);color:var(--red)}.chipi.amber{background:var(--amberSoft);color:var(--amber)}
.chipi.blue{background:var(--blueSoft);color:var(--blue)}.chipi.acc{background:var(--accentSoft);color:var(--accent)}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 500px at 80% -10%,var(--greenSoft),transparent),var(--bg)}
.auth-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow)}
.auth-tools{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--greenSoft);color:var(--green);display:grid;place-items:center;overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:cover}
.brand h1{font-size:20px;font-weight:700}
.brand small{color:var(--muted);font-size:12px;display:block}
.tabs{display:flex;background:var(--panel2);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.in{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
html[data-theme="dark"] .in{background:var(--bg)}
.in:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--greenSoft)}
textarea.in{min-height:90px;resize:vertical}
.btn{border:1px solid transparent;border-radius:10px;padding:9px 15px;font-weight:600;cursor:pointer;background:var(--panel2);display:inline-flex;align-items:center;gap:7px;justify-content:center;white-space:nowrap;transition:background .15s,border-color .15s,filter .15s}
.btn:hover{filter:brightness(.97)}
html[data-theme="dark"] .btn:hover{filter:brightness(1.15)}
.btn.pri{background:var(--green);color:var(--onpri)}
.btn.danger{background:var(--redSoft);color:var(--red)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ai{background:var(--navy);color:var(--panel)}
html[data-theme="dark"] .btn.ai{color:#0B1210}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn.icon{padding:7px;width:36px;height:36px}
.msg{font-size:13px;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--panel2)}
.msg.err{background:var(--redSoft);color:var(--redTxt)}
.msg.ok{background:var(--greenSoft);color:var(--greenTxt)}
.powered{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}

/* shell (logical properties: the sidebar sits at the start side in Arabic and in English) */
.shell{display:flex;min-height:100vh}
.side{width:250px;background:var(--panel);border-inline-end:1px solid var(--line);padding:18px 12px;position:fixed;top:0;bottom:0;inset-inline-start:0;overflow-y:auto;z-index:40;transition:transform .25s}
.side .brand{padding:0 6px}
.nav button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--muted);text-align:start;font-weight:500}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.on{background:var(--greenSoft);color:var(--green);font-weight:600}
.nav .ico{width:22px;display:grid;place-items:center}
.nav .sec{font-size:11px;color:var(--muted);opacity:.8;padding:14px 12px 4px;letter-spacing:.2px}
.nav .cnt{margin-inline-start:auto;background:var(--redSoft);color:var(--red);font-size:11px;padding:1px 7px;border-radius:20px}
.main{flex:1;margin-inline-start:250px;min-width:0}
.top{position:sticky;top:0;z-index:30;background:var(--topbg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:10px}
.top h2{font-size:18px;font-weight:700;flex:1}
.me{display:flex;align-items:center;gap:8px;cursor:pointer}
.av{width:36px;height:36px;border-radius:50%;background:var(--greenSoft);display:grid;place-items:center;overflow:hidden;font-weight:700;color:var(--green);flex-shrink:0;font-size:14px}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:84px;height:84px;font-size:30px}
.menu-btn{display:none;border:0;background:var(--panel2);width:38px;height:38px;border-radius:10px;cursor:pointer}
.content{padding:22px;max-width:1240px}
.overlay{display:none}
.tbtn{border:1px solid var(--line);background:var(--panel);width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--text)}
.tbtn:hover{border-color:var(--green);color:var(--green)}

@media(max-width:900px){
  .side{transform:translateX(100%)}
  html[dir="ltr"] .side{transform:translateX(-100%)}
  .side.open,html[dir="ltr"] .side.open{transform:none}
  .overlay.open{display:block;position:fixed;inset:0;background:var(--scrim);z-index:35}
  .main{margin-inline-start:0}
  .menu-btn{display:grid;place-items:center}
  .content{padding:14px}
  .top{padding:10px 14px}
  .me .nm{display:none}
}

/* cards */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g21{grid-template-columns:2fr 1fr}
.kgrid{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.g3f{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
@media(max-width:1000px){.g21{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .i{color:var(--muted)}
.card .sub{font-size:12px;color:var(--muted);font-weight:400;margin-inline-start:auto}
.kpi{cursor:pointer;transition:.15s}
.kpi:hover{border-color:var(--green)}
.kpi .v{font-size:26px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .s{font-size:12px;margin-top:4px}
.kt{display:flex;flex-direction:column;gap:6px}
.kt .top2{display:flex;align-items:center;gap:10px}
.kt .v{font-size:24px;overflow-wrap:anywhere}
@media(max-width:500px){.ai-hero .row>.btn{width:100%}.kt .v{font-size:19px}.kgrid{gap:10px}.kt{padding:12px}}
.up{color:var(--greenTxt)}.down{color:var(--redTxt)}
.mt{margin-top:16px}.mb{margin-bottom:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.b-green{background:var(--greenSoft);color:var(--greenTxt)}
.b-red{background:var(--redSoft);color:var(--redTxt)}
.b-amber{background:var(--amberSoft);color:var(--amberTxt)}
.b-blue{background:var(--blueSoft);color:var(--blueTxt)}
.list .it{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:8px;flex-shrink:0}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty .i.xl{color:var(--c4);margin-bottom:6px}
.bar{height:7px;background:var(--panel2);border-radius:10px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green);border-radius:10px}

/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.ln{height:0;border-top:2px dashed var(--muted);border-radius:0;width:14px}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex-shrink:0}
.donut .dl{flex:1;min-width:130px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.donut .dl div{display:flex;align-items:center;gap:8px}
.donut .dl i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.donut .dl b{margin-inline-start:auto;font-variant-numeric:tabular-nums}
.hb{display:flex;flex-direction:column;gap:12px}
.hb .r{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;align-items:center;gap:10px;font-size:13px}
.hb .r.clk{cursor:pointer}
.hb .r .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .trk{height:8px;background:var(--panel2);border-radius:8px;overflow:hidden}
.hb .trk i{display:block;height:100%;border-radius:8px}
.hb.st .r{grid-template-columns:1fr auto;row-gap:4px}.hb.st .r .trk{grid-column:1 / -1;grid-row:2}.hb.st .r .nm{white-space:normal}
.hb .vv{font-variant-numeric:tabular-nums;color:var(--muted);min-width:42px;text-align:end;font-size:12px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat3 div{background:var(--panel2);border-radius:12px;padding:12px;text-align:center}
.stat3 b{display:block;font-size:22px}
.note{font-size:11px;color:var(--muted);margin-top:8px}

/* records */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .in{flex:1;min-width:180px}
.rec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.rec:hover{border-color:var(--green)}
.rec .t{font-weight:700;font-size:15px}
.rec .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.person{display:flex;align-items:center;gap:12px}

/* ai */
.ai-hero{background:linear-gradient(135deg,var(--greenSoft),var(--accentSoft));border:1px solid var(--line);border-radius:16px;padding:16px}
.ring{width:96px;height:96px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px}
.risk{border-inline-start:3px solid var(--line);padding:8px 12px;margin-bottom:8px;background:var(--panel2);border-radius:8px}
.risk.h{border-inline-start-color:var(--red)}.risk.m{border-inline-start-color:var(--amber)}.risk.l{border-inline-start-color:var(--blue)}
.risk.g{border-inline-start-color:var(--green)}.risk.b{border-inline-start-color:var(--blue)}
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px}
.msgs{flex:1;overflow-y:auto;padding:4px 2px 12px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:85%;padding:11px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.bub.u{align-self:flex-start;background:var(--green);color:var(--onpri);border-end-start-radius:4px}
.bub.a{align-self:flex-end;background:var(--panel);border:1px solid var(--line);border-end-end-radius:4px}
.bub.a ul{padding-inline-start:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--green);color:var(--green)}
.composer{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.composer .in{flex:1}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin:0 2px;animation:bl 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}
.fab{position:fixed;inset-inline-end:18px;bottom:18px;width:54px;height:54px;border-radius:50%;border:0;background:var(--green);color:var(--onpri);cursor:pointer;box-shadow:0 8px 24px rgba(17,128,106,.3);z-index:25;display:grid;place-items:center}

/* modal */
.modal{position:fixed;inset:0;background:var(--scrim);z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal{align-items:center}}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px;border:1px solid var(--line)}
@media(min-width:700px){.sheet{border-radius:20px}}
.sheet h3{font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:500px){.two{grid-template-columns:1fr}}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:80;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
/* cropper */
.crop-wrap{position:relative;width:min(300px,100%);aspect-ratio:1;margin:0 auto;touch-action:none;border-radius:14px;overflow:hidden;background:#000}
.crop-wrap canvas{width:100%;height:100%;display:block;cursor:grab}
.crop-ring{position:absolute;inset:0;pointer-events:none;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.55);outline:2px solid rgba(255,255,255,.8);outline-offset:-2px}
input[type=range]{width:100%;accent-color:var(--green)}
/* rooms */
.room-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.avs{display:flex}
.avs .av{width:28px;height:28px;font-size:11px;border:2px solid var(--panel);margin-inline-end:-8px}
.m{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.m.me{align-self:flex-start;flex-direction:row}
.m.other{align-self:flex-end;flex-direction:row-reverse}
.m .av{width:30px;height:30px;font-size:12px}
.m .b{padding:9px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word;min-width:60px}
.m.me .b{background:var(--mine);border-color:var(--mineLine)}
.m .who{font-size:12px;color:var(--green);font-weight:600;margin-bottom:2px}
.m .tm{font-size:11px;color:var(--muted);margin-top:4px}
.m img.pic{max-width:240px;max-height:260px;border-radius:10px;display:block;cursor:pointer}
.m audio{width:230px;max-width:100%;height:40px}
.fileln{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.fileln .ic{width:40px;height:40px;border-radius:10px;background:var(--panel2);display:grid;place-items:center}
.m.ai{align-self:center;max-width:95%}
.m.ai .b{background:linear-gradient(135deg,var(--greenSoft),var(--accentSoft));border-color:var(--line)}
.rec-bar{display:flex;align-items:center;gap:10px;background:var(--redSoft);color:var(--redTxt);border-radius:12px;padding:8px 12px;flex:1}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:bl 1s infinite}
.iconbtn{border:0;background:var(--panel2);width:42px;height:42px;border-radius:12px;cursor:pointer;flex-shrink:0;display:grid;place-items:center;color:var(--text)}
.pick{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer}
.pick:hover{background:var(--panel2)}
.pick input{width:18px;height:18px;accent-color:var(--green)}
.tr{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);font-size:13px}
.tr div{margin-top:3px}
.tr .lg{font-size:11px;color:var(--muted);margin-inline-end:6px}
.trbtn{background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;margin-top:4px;padding:0;display:inline-flex;align-items:center;gap:4px}
.trbtn:hover{color:var(--green)}
.trbtn .i{width:14px;height:14px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:90;display:grid;place-items:center;padding:16px}

// ===== Charts (SVG drawn here: no external library, works offline and under the page's security policy) =====
const fmtShort = (n) => new Intl.NumberFormat(LOC(), { notation:"compact", maximumFractionDigits:1 }).format(Number(n) || 0);
const monthShort = (ym) => { const [y, m] = ym.split("-").map(Number); return new Date(Date.UTC(y, m - 1, 15)).toLocaleDateString(DLOC(), { month:"short", timeZone:"UTC" }); };
function chartBars(series, keys, opt = {}) {
  // series: [{label, values:{k:number}}], keys: [{k, color, label}]; reading order follows the language
  const rows = LANG === "en" ? series : [...series].reverse();
  const W = 640, H = opt.h || 230, pl = 46, pr = 8, pt = 10, pb = 26;
  const max = Math.max(1, ...rows.flatMap((r) => keys.map((k) => Number(r.values[k.k]) || 0)));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); return Math.ceil(max / p) * p; })();
  const y = (v) => pt + (H - pt - pb) * (1 - v / nice);
  const gw = (W - pl - pr) / rows.length, bw = Math.min(18, (gw * 0.7) / keys.length);
  const grid = [0, .25, .5, .75, 1].map((f) => `<line x1="${pl}" x2="${W - pr}" y1="${y(nice * f)}" y2="${y(nice * f)}" style="stroke:var(--line)"/>
    <text x="${pl - 6}" y="${y(nice * f) + 4}" text-anchor="end">${fmtShort(nice * f)}</text>`).join("");
  const hl = opt.highlight ?? -1;
  const bars = rows.map((r, i) => {
    const x0 = pl + gw * i + (gw - bw * keys.length) / 2;
    const isHl = hl >= 0 && r === series[hl];
    return keys.map((k, j) => { const v = Number(r.values[k.k]) || 0;
      return `<rect x="${x0 + j * bw}" y="${y(v)}" width="${bw - 2}" height="${Math.max(0, y(0) - y(v))}" rx="3" style="fill:${k.color};opacity:${hl < 0 || isHl ? 1 : .5}"><title>${esc(r.label)} · ${esc(k.label)}: ${fmtNum(v)}</title></rect>`; }).join("")
      + `<text x="${pl + gw * i + gw / 2}" y="${H - 8}" text-anchor="middle">${esc(r.label)}</text>`;
  }).join("");
  const avg = opt.avgKey ? series.reduce((s, r) => s + (Number(r.values[opt.avgKey]) || 0), 0) / series.length : null;
  const avgLine = avg ? `<line x1="${pl}" x2="${W - pr}" y1="${y(avg)}" y2="${y(avg)}" style="stroke:var(--muted)" stroke-dasharray="5 4"/>` : "";
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title || "")}" style="direction:ltr">${grid}${bars}${avgLine}</svg></div>
    <div class="legend">${keys.map((k) => `<span><i style="background:${k.color}"></i>${esc(k.label)}</span>`).join("")}${avg ? `<span><i class="ln"></i>${esc(opt.avgLabel || "")}</span>` : ""}</div>`;
}
function chartDonut(parts, center, sub) {
  const tot = parts.reduce((s, p) => s + (Number(p.value) || 0), 0);
  const R = 52, C = 2 * Math.PI * R; let off = 0;
  const segs = tot ? parts.filter((p) => p.value > 0).map((p) => { const len = (p.value / tot) * C;
    const s = `<circle cx="70" cy="70" r="${R}" fill="none" style="stroke:${p.color}" stroke-width="18" stroke-dasharray="${Math.max(0, len - 2)} ${C}" stroke-dashoffset="${-off}"><title>${esc(p.label)}: ${fmtNum(p.value)}</title></circle>`;
    off += len; return s; }).join("") : "";
  return `<div class="donut"><svg viewBox="0 0 140 140" role="img"><g transform="rotate(-90 70 70)"><circle cx="70" cy="70" r="${R}" fill="none" style="stroke:var(--panel2)" stroke-width="18"/>${segs}</g>
      <text x="70" y="68" text-anchor="middle" style="fill:var(--text);font-size:22px;font-weight:700;font-family:inherit">${esc(center)}</text>
      <text x="70" y="88" text-anchor="middle" style="fill:var(--muted);font-size:11px;font-family:inherit">${esc(sub)}</text></svg>
    <div class="dl">${parts.map((p) => `<div><i style="background:${p.color}"></i><span>${esc(p.label)}</span><b>${tot ? Math.round((p.value / tot) * 100) : 0}%</b></div>`).join("")}</div></div>`;
}

  // rows: [{label, value, max, color, text, go}] ; go = fixed view key (validated by the caller), never free text
  const max = Math.max(1, ...rows.map((r) => r.max ?? r.value));
  return `<div class="hb ${stacked ? "st" : ""}">${rows.map((r) => `<div class="r ${r.go ? "clk" : ""}" ${r.go ? `onclick="${r.go}"` : ""}><span class="nm" title="${esc(r.label)}">${esc(r.label)}</span>

// The API returns at most 1,000 rows per request. fetchAll pages through with .range() so nothing is silently cut off.
// Large business tables (vehicles, invoices, ...) are never loaded whole: they are paged on the server (loadPage).
const PAGE_SIZE = 50;
async function fetchAll(build, chunk = 1000) {
  let out = [], from = 0;
  for (;;) {
    const { data, error } = await build().range(from, from + chunk - 1);
    if (error) throw error;
    out = out.concat(data ?? []);
    if (!data || data.length < chunk) return out;
    from += chunk;
  }
}

// one server page of a business table: filters + search + count are done by the database
function pageState(k) {
  S.page = S.page || {};
  return (S.page[k] = S.page[k] || { n:0, q:"", status:"", dep:"", rows:null, total:0, loading:false, key:"" });
}
const searchSafe = (q) => q.replace(/[,()*%\\:"']/g, " ").trim().slice(0, 60);
async function loadPage(k) {
  const st = pageState(k), cfg = ENT[k];
  const key = JSON.stringify([S.cid, st.n, st.q, st.status, st.dep]);
  if (st.loading || (st.rows && st.key === key)) return;
  st.loading = true;
  let q = sb.from(k).select("*", { count:"exact" }).eq("company_id", S.cid);
  if (st.status && cfg.status) q = q.eq(cfg.status, st.status);
  if (st.dep) q = q.eq("department_id", st.dep);
  const term = searchSafe(st.q);
  if (term) q = q.or(cfg.search.map((c) => `${c}.ilike.*${term}*`).join(","));
  const { data, count, error } = await q.order("updated_at", { ascending:false }).order("id").range(st.n * PAGE_SIZE, st.n * PAGE_SIZE + PAGE_SIZE - 1);
  st.loading = false;
  if (error) { toast("خطأ في التحميل: " + error.message); st.rows = []; st.total = 0; }
  else { st.rows = data ?? []; st.total = count ?? 0; }
  st.key = key;
  if (S.view === k) renderView();
}
async function getRecord(k, id) {
  const hit = (S.page?.[k]?.rows ?? []).find((r) => r.id === id);
  if (hit) return hit;
  const { data } = await sb.from(k).select("*").eq("id", id).single();
  return data;
}

async function resizeImage(file, max = 1600, q = 0.85) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = img.width * s; c.height = img.height * s;
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise((res) => c.toBlob(res, "image/jpeg", q));
}
const blobToB64 = (b) => new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.readAsDataURL(b); });

async function uploadImage(file, folder) {
  const blob = await resizeImage(file, 600, 0.85);
  const path = `${folder}/${Date.now()}.jpg`;
  const { error } = await sb.storage.from("avatars").upload(path, blob, { contentType:"image/jpeg", upsert:true });
  if (error) throw error;
  return sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
}

}

// ===== Alerts (computed by the database over ALL rows: public.company_alerts) =====
function alertText(a) {
  const d = a.days;
  switch (a.kind) {
    case "expiry":  return d < 0 ? L(`${a.label}: منتهي منذ ${-d} يوم`, `${a.label}: expired ${-d} days ago`) : L(`${a.label}: بعد ${d} يوم`, `${a.label}: in ${d} days`);
    case "hearing": return L(`جلسة قضية "${a.label}" بعد ${d} يوم`, `Hearing for case "${a.label}" in ${d} days`);
    case "overdue": return L(`فاتورة ${a.label} متأخرة ${-d} يوم (${fmtSAR(a.amount)})`, `Invoice ${a.label} is ${-d} days overdue (${fmtSAR(a.amount)})`);
    case "late":    return L(`مشروع "${a.label}" متأخر أو تجاوز موعد التسليم`, `Project "${a.label}" is late or past its delivery date`);
    case "urgent":  return L(`طلب عاجل: ${a.label}`, `Urgent request: ${a.label}`);
    case "note":    return L(`ملاحظة مدير بانتظار الرد: ${a.label}`, `Manager note awaiting a reply: ${a.label}`);
    default:        return a.label;
  }
}
function computeAlerts() {
  return (S.alerts ?? []).map((a) => ({ lvl:a.level, text:alertText(a), view:a.entity === "manager_notes" ? "notes" : a.entity, dep:a.department_id, id:a.entity_id }));
}

function openCropper(file, onDone) {
  const url = URL.createObjectURL(file);
  modal(`<div class="row"><h3 class="sp">${ic("crop")} قص الصورة</h3><button class="btn sm ghost icon" title="إغلاق" onclick="App.close()">${ic("x")}</button></div>
    <div class="crop-wrap" id="cropWrap"><canvas id="cropCv" width="600" height="600"></canvas><div class="crop-ring"></div></div>
    <label class="f mt"><span>تكبير وتصغير</span><input type="range" id="cropZoom" dir="ltr" min="1" max="4" step="0.01" value="1"></label>
    <p class="muted small">اسحب الصورة بإصبعك عشان تحركها داخل الدائرة</p>
    <div class="row mt"><button class="btn pri" id="cropOk">حفظ الصورة</button><button class="btn ghost" onclick="App.close()">إلغاء</button></div>`);
  const cv = $("#cropCv"), ctx = cv.getContext("2d"), N = 600;
  const img = new Image();
  let base = 1, zoom = 1, ox = 0, oy = 0, drag = null;
  const w = () => img.width * base * zoom, h = () => img.height * base * zoom;
  const clamp = () => { ox = Math.min(0, Math.max(N - w(), ox)); oy = Math.min(0, Math.max(N - h(), oy)); };
  const draw = () => { clamp(); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, N, N); ctx.drawImage(img, ox, oy, w(), h()); };
  img.onload = () => { base = Math.max(N / img.width, N / img.height); ox = (N - w()) / 2; oy = (N - h()) / 2; draw(); };
  img.src = url;
  const ratio = () => N / cv.clientWidth;
  cv.addEventListener("pointerdown", (e) => { drag = { x:e.clientX, y:e.clientY }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", (e) => { if (!drag) return; ox += (e.clientX - drag.x) * ratio(); oy += (e.clientY - drag.y) * ratio(); drag = { x:e.clientX, y:e.clientY }; draw(); });
  cv.addEventListener("pointerup", () => (drag = null));
  cv.addEventListener("pointercancel", () => (drag = null));
  $("#cropZoom").addEventListener("input", (e) => {
    const nz = Number(e.target.value);
    const cx = (N / 2 - ox) / (base * zoom), cy = (N / 2 - oy) / (base * zoom);
    zoom = nz; ox = N / 2 - cx * base * zoom; oy = N / 2 - cy * base * zoom; draw();
  });
  $("#cropOk").addEventListener("click", () => {
    const out = document.createElement("canvas"); out.width = 400; out.height = 400;
    out.getContext("2d").drawImage(cv, 0, 0, N, N, 0, 0, 400, 400);
    $("#cropOk").disabled = true; $("#cropOk").innerHTML = `<span class="spin"></span>`;
    out.toBlob((b) => { URL.revokeObjectURL(url); onDone(b); }, "image/jpeg", 0.9);
  });
}

  const path = `${folder}/${Date.now()}.jpg`;

const Room = {
  id:null, ch:null, rec:null,
  async open(id) {
    if (this.id === id && S.roomMsgs?.[id]) { this.render(); return; }
    this.leave(); this.id = id;
    S.roomMsgs = S.roomMsgs || {};
    const { data } = await sb.from("room_messages").select("*").eq("room_id", id).order("created_at").limit(500);
    S.roomMsgs[id] = data ?? [];
    this.render();
    this.ch = sb.channel("room-" + id)
      .on("postgres_changes", { event:"INSERT", schema:"public", table:"room_messages", filter:`room_id=eq.${id}` }, (p) => this.add(p.new))
      .on("postgres_changes", { event:"UPDATE", schema:"public", table:"room_messages", filter:`room_id=eq.${id}` }, (p) => { const l = S.roomMsgs[id] || []; const i = l.findIndex((x) => x.id === p.new.id); if (i >= 0) { l[i] = { ...l[i], ...p.new }; this.render(); } })
      .on("postgres_changes", { event:"DELETE", schema:"public", table:"room_messages", filter:`room_id=eq.${id}` }, (p) => { S.roomMsgs[id] = (S.roomMsgs[id] || []).filter((m) => m.id !== p.old.id); this.render(); })
      .subscribe();
  },
  leave() { if (this.ch) { sb.removeChannel(this.ch); this.ch = null; } this.id = null; this.stopRec(true); },
  add(m) {
    const list = S.roomMsgs[m.room_id] = S.roomMsgs[m.room_id] || [];
    if (list.some((x) => x.id === m.id)) return;
    list.push(m); if (this.id === m.room_id) this.render();
  },
  async render() {
    const box = $("#msgs"); if (!box || !this.id) return;
    const list = S.roomMsgs[this.id] || [];
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    box.innerHTML = list.length ? list.map(msgHtml).join("") : `<div class="empty">ابدأ النقاش<br><span class="small">تقدر ترسل نص، صور، مستندات، أو رسالة صوتية</span></div>`;
    if (atBottom || !box.dataset.init) { box.scrollTop = box.scrollHeight; box.dataset.init = "1"; }
    const need = list.filter((m) => m.file_path && !S.urls[m.file_path]).map((m) => m.file_path);
    if (need.length) {
      const { data } = await sb.storage.from("rooms").createSignedUrls(need, 60 * 60 * 6);
      (data ?? []).forEach((d) => { if (d.signedUrl) S.urls[d.path] = d.signedUrl; });
      if ((data ?? []).some((d) => d.signedUrl)) this.render();
    }
  },
  async post(row) {
    const { data, error } = await sb.from("room_messages").insert({ room_id:this.id, ...row }).select().single();
    if (error) { toast("خطأ: " + error.message); return null; }
    this.add(data); return data;
  },
  async send(e) {
    e.preventDefault(); const i = $("#rmInput"); const t = i.value.trim(); if (!t) return;
    i.value = ""; const m = await this.post({ kind:"text", body:t }); i.focus();
    if (m && needsTr(t)) this.translate(m.id);
  },
  async upload(blob, name, mime) {
    if (blob.size > 50 * 1048576) { toast("الملف أكبر من ٥٠ ميجا"); return null; }
    const safe = name.replace(/[^\w.\-]+/g, "_").slice(-60) || "file";
    const path = `${this.id}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}-${safe}`;
    const { error } = await sb.storage.from("rooms").upload(path, blob, { contentType:mime || "application/octet-stream" });
    if (error) { toast("خطأ في الرفع: " + error.message); return null; }
    return path;
  },
  async files(input) {
    const files = [...input.files]; input.value = "";
    for (const f of files) {
      toast(`جاري رفع ${f.name}...`);
      const isImg = f.type.startsWith("image/") && !/svg/.test(f.type);
      const blob = isImg ? await resizeImage(f, 1800, 0.85).catch(() => f) : f;
      const path = await this.upload(blob, isImg ? f.name.replace(/\.\w+$/, "") + ".jpg" : f.name, isImg ? "image/jpeg" : f.type);
      if (path) await this.post({ kind:isImg ? "image" : "file", file_path:path, file_name:f.name, file_size:blob.size, mime:isImg ? "image/jpeg" : f.type });
    }
  },
  async record() {
    if (this.rec) return this.stopRec(false);
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast("جهازك ما يدعم التسجيل الصوتي من المتصفح");
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
    catch { return toast("اسمح للمتصفح باستخدام المايكروفون"); }
    const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/aac"].find((t) => MediaRecorder.isTypeSupported?.(t)) || "";
    const mr = new MediaRecorder(stream, type ? { mimeType:type } : undefined);
    const chunks = []; const started = Date.now();
    mr.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    this.rec = { mr, stream, chunks, started, cancel:false };
    mr.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      const r = this.rec; this.rec = null; clearInterval(this.timer); this.recUI(false);
      if (r.cancel || !chunks.length) return;
      const mime = mr.mimeType || type || "audio/mp4";
      const blob = new Blob(chunks, { type:mime });
      const ext = /webm/.test(mime) ? "webm" : "m4a";
      const secs = Math.round((Date.now() - started) / 1000);
      const path = await this.upload(blob, `voice.${ext}`, mime);
      if (path) await this.post({ kind:"audio", file_path:path, file_name:`رسالة صوتية (${secs} ث)`, file_size:blob.size, mime });
    };
    mr.start(); this.recUI(true);
    this.timer = setInterval(() => { const s = Math.round((Date.now() - started) / 1000); const el = $("#recT"); if (el) el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }, 500);
  },
  stopRec(cancel) { if (this.rec) { this.rec.cancel = cancel; try { this.rec.mr.stop(); } catch {} } },
  recUI(on) {
    const c = $("#composer"); if (!c) return;
    const form = c.querySelector("form"), mic = $("#micBtn");
    let bar = $("#recBar");
    if (on) {
      form.classList.add("hidden");
      if (!bar) { bar = document.createElement("div"); bar.id = "recBar"; bar.className = "rec-bar";
        bar.innerHTML = `<span class="rec-dot"></span><span>جاري التسجيل <b id="recT">0:00</b></span><span class="sp"></span><button class="btn sm ghost" onclick="Room.stopRec(true)">إلغاء</button>`;
        c.appendChild(bar); }
      mic.innerHTML = ic("send"); mic.title = "إرسال التسجيل";
    } else { form?.classList.remove("hidden"); bar?.remove(); if (mic) { mic.innerHTML = ic("mic"); mic.title = "رسالة صوتية"; } }
  },
  async translate(mid) {
    const list = S.roomMsgs[this.id] || []; const m = list.find((x) => x.id === mid); if (!m) return;
    S.trPending = S.trPending || {}; S.trPending[mid] = true; this.render();
    try { const { translation } = await ai({ mode:"translate", message_id:mid }); if (translation) m.translation = translation; }
    catch (err) { toast(err.message); }
    delete S.trPending[mid]; this.render();
  },
  zoom(url) {
    const d = document.createElement("div"); d.className = "lightbox"; d.innerHTML = `<img src="${esc(url)}">`;
    d.onclick = () => d.remove(); document.body.appendChild(d);
  },
};

function md(t) {
  let h = esc(t);
  h = h.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  h = h.replace(/^#{1,4}\s*(.+)$/gm, "<b>$1</b>");
  h = h.replace(/^\s*[-•*]\s+(.+)$/gm, "• $1");
  return h;
}

    rows.length ? `<div class="muted small mb">${fmtNum(st.total)} سجل</div><div class="grid g3">${rows.map((r) => recCard(k, r)).join("")}</div>${pager}` :
    `<div class="card empty">${ic(cfg.icon, "xl")}<br>${st.q || st.status ? "لا توجد نتائج مطابقة" : "لا توجد سجلات بعد"}<br>
     <button class="btn pri mt" onclick="App.edit('${k}')">+ إضافة ${cfg.one}</button>
     ${AI_EXTRACT.includes(k) ? `<div class="small mt">أو صوّر المستند وخل الذكاء الاصطناعي يعبّي البيانات</div>` : ""}</div>`}`;
}
function recCard(k, r) {
  const cfg = ENT[k];
  const badges = [];
  if (cfg.status && r[cfg.status]) badges.push(`<span class="badge ${cfg.statusColor?.[r[cfg.status]] || ""}">${esc(r[cfg.status])}</span>`);
  if (k === "requests" && r.priority === "عاجل") badges.push(`<span class="badge b-red">عاجل</span>`);
  for (const f of cfg.fields) {
    if (f.t !== "date" || !r[f.k]) continue;
    const d = daysLeft(r[f.k]);
    let cls = "";
    if (f.exp) cls = d < 0 ? "b-red" : d <= 30 ? "b-amber" : "";
    if (f.hearing && r.status !== "مغلقة") cls = d >= 0 && d <= 14 ? "b-amber" : "";
    if (f.due && r.status !== "مدفوعة") cls = d < 0 ? "b-red" : d <= 7 ? "b-amber" : "";
    if (f.deadline && r.status !== "مكتمل") cls = d < 0 ? "b-red" : "";
    if (f.exp || f.hearing || f.due || f.deadline) badges.push(`<span class="badge ${cls}">${f.l}: ${fmtDate(r[f.k])}${f.exp && d < 0 ? " (منتهي)" : ""}</span>`);
  }
  if (isAdmin()) badges.push(`<span class="badge">${esc(depName(r.department_id))}</span>`);
  return `<div class="rec" onclick="App.edit('${k}','${safeId(r.id)}')">
    <div class="t">${esc(r[cfg.primary])}</div>
    ${cfg.sub(r) ? `<div class="muted small">${esc(cfg.sub(r))}</div>` : ""}
    ${k === "vehicles" && r.location ? `<div class="small muted">${ic("mappin")} ${esc(r.location)}</div>` : ""}
    ${k === "legal_cases" && r.last_update ? `<div class="small" style="margin-top:4px">${esc(r.last_update.slice(0, 120))}</div>` : ""}
    ${cfg.progress ? `<div class="bar"><i style="width:${r.progress || 0}%"></i></div><div class="muted small">${r.progress || 0}% · ${fmtSAR(r.contract_value)}</div>` : ""}
    <div class="meta">${badges.join("")}</div></div>`;
}

// ===== Forms =====
function modal(html) {
  $("#modal-root").innerHTML = `<div class="modal" onclick="if(event.target===this)App.close()"><div class="sheet">${html}</div></div>`;
}
function fieldInput(f, v) {
  const val = v ?? "";
  if (f.t === "select") return `<select class="in" name="${f.k}">${f.o.map((o) => `<option ${o === val ? "selected" : ""}>${o}</option>`).join("")}</select>`;
  if (f.t === "textarea") return `<textarea class="in" name="${f.k}" placeholder="${esc(f.ph || "")}">${esc(val)}</textarea>`;
  return `<input class="in" name="${f.k}" type="${f.t === "date" ? "date" : f.t === "number" ? "number" : "text"}" ${f.t === "number" ? 'step="any"' : ""} value="${esc(val)}" placeholder="${esc(f.ph || "")}" ${f.req ? "required" : ""}>`;
}
function entityForm(k, r = {}) {
  const cfg = ENT[k], isNew = !r.id;
  const defDep = r.department_id || (isAdmin() ? (cfg.def && depByName(cfg.def)) || S.me?.department_id : S.me?.department_id);
  const wide = cfg.fields.filter((f) => f.wide), narrow = cfg.fields.filter((f) => !f.wide);
  modal(`
    <div class="row"><h3 class="sp">${isNew ? "إضافة " + cfg.one : "تعديل " + cfg.one}</h3><button class="btn sm ghost icon" title="إغلاق" onclick="App.close()">${ic("x")}</button></div>
    ${AI_EXTRACT.includes(k) ? `<label class="btn ai full mb" id="scanBtn">${ic("camera")} صوّر المستند وخل الذكاء الاصطناعي يعبّي البيانات<input type="file" accept="image/*" capture="environment" class="hidden" onchange="App.scan('${k}', this)"></label>` : ""}
    <form id="ef" onsubmit="App.save(event,'${k}','${safeId(r.id)}')">
      ${wide.filter((f) => f.req).map((f) => `<label class="f"><span>${f.l}</span>${fieldInput(f, r[f.k])}</label>`).join("")}
      <div class="two">${narrow.map((f) => `<label class="f"><span>${f.l}</span>${fieldInput(f, r[f.k])}</label>`).join("")}</div>
      ${wide.filter((f) => !f.req).map((f) => `<label class="f"><span>${f.l}</span>${fieldInput(f, r[f.k])}</label>`).join("")}
      ${isAdmin() ? `<label class="f"><span>القسم المسؤول</span><select class="in" name="department_id">${S.deps.map((d) => `<option value="${d.id}" ${d.id === defDep ? "selected" : ""}>${esc(d.name)}</option>`).join("")}</select></label>`
        : `<input type="hidden" name="department_id" value="${esc(defDep || "")}">`}
      <div class="row mt"><button class="btn pri">حفظ</button><span class="sp"></span>
        ${!isNew && isAdmin() ? `<button type="button" class="btn danger" onclick="App.del('${k}','${safeId(r.id)}')">حذف</button>` : ""}</div>
      ${!isNew && r.updated_at ? `<div class="muted small mt">آخر تحديث: ${fmtDate(r.updated_at)}${r.created_by ? " · أضافه " + esc(S.people.find((p) => p.id === r.created_by)?.full_name || "") : ""}</div>` : ""}
    </form>`);
}

  async setNewPw(e) {

    const { error } = await sb.auth.updateUser({ password:f.get("password") });
    if (error) { b.disabled = false; return renderAuth({ t:"err", m:error.message }); }
    S.authTab = "login"; S.recovering = false; toast("تم تغيير كلمة المرور"); boot((await sb.auth.getSession()).data.session);

    const { error } = await sb.auth.updateUser({ password:f.get("password") });

  },

    const { error } = await sb.auth.signInWithPassword({ email:String(f.get("email")).trim().toLowerCase(), password:f.get("password") });
    if (error) { btn.disabled = false; btn.textContent = "دخول"; }
    if (error) renderAuth({ t:"err", m:error.message.includes("Invalid") ? "البريد أو كلمة المرور غير صحيحة" : error.message.includes("confirm") ? "فعّل حسابك من الرابط اللي وصلك على البريد أولاً" : error.message });

    renderAuth(error ? { t:"err", m:error.message.includes("TOO_MANY") ? "محاولات كثيرة. انتظر 15 دقيقة ثم حاول مرة ثانية." : error.message } : data ? null : { t:"err", m:"رمز الشركة غير صحيح" });

  async _signup(e) {

    const code = String(f.get("company_code") || "").trim().toUpperCase();
    if (code && (!S.signupCo || S.signupCode !== code)) { await App.checkCode(); if (!S.signupCo) return; }
    if (String(f.get("password")).length < 8) return renderAuth({ t:"err", m:"كلمة المرور لازم تكون 8 أحرف أو أكثر" });
    const { data, error } = await sb.auth.signUp({ email, password:f.get("password"),
      options:{ emailRedirectTo:location.origin + location.pathname, data:{ full_name:f.get("full_name"), company_code:code, job_title:f.get("job_title"), phone:f.get("phone") } } });

  menu(o) { $("#side")?.classList.toggle("open", o); $("#ov")?.classList.toggle("open", o); },

  search(k, v) {

    }, 350);
  },
  filter(k, v) { const st = pageState(k); st.status = v; st.n = 0; renderView(); },
  pageTo(k, d) { const st = pageState(k); st.n = Math.max(0, st.n + d); renderView(); window.scrollTo(0, 0); },

  async edit(k, id) {
    if (!id) return entityForm(k, {});
    const r = await getRecord(k, safeId(id));
    if (!r) return toast("السجل غير موجود أو محذوف");
    entityForm(k, r);
  },
  async save(e, k, id) {
    e.preventDefault();
    const fd = new FormData(e.target), row = {};
    for (const f of ENT[k].fields) { let v = fd.get(f.k); if (v === "" || v == null) v = null; else if (f.t === "number") v = Number(v); row[f.k] = v; }
    if (k === "projects" && row.progress != null) row.progress = Math.max(0, Math.min(100, Math.round(row.progress)));
    row.department_id = fd.get("department_id") || null;
    row.updated_at = new Date().toISOString();
    const q = id ? sb.from(k).update(row).eq("id", id) : sb.from(k).insert({ ...row, company_id:S.cid });
    const { error } = await q;
    if (error) return toast("خطأ: " + error.message);
    App.close(); toast("تم الحفظ"); await reload();
  },
  async del(k, id) {
    if (!confirmT("نقل السجل إلى سلة المحذوفات؟ تقدر تسترجعه خلال 30 يوم.")) return;
    const { error } = await sb.rpc("soft_delete", { tbl:k, rid:id });
    if (error) return toast("خطأ: " + error.message);
    App.close(); toast("نُقل إلى سلة المحذوفات"); await reload();
  },
  async scan(k, input) {
    const file = input.files[0]; if (!file) return;
    const btn = $("#scanBtn"); const old = btn.innerHTML;
    btn.innerHTML = `<span class="spin"></span> يقين يقرأ المستند...`;
    try {
      const blob = await resizeImage(file, 1600, 0.85);
      const { fields } = await ai({ mode:"extract", target:k, image:await blobToB64(blob), media_type:"image/jpeg" });
      let n = 0;
      for (const [key, val] of Object.entries(fields || {})) {
        const el = document.querySelector(`#ef [name="${key}"]`);
        if (el && val !== null && val !== "") {
          if (el.tagName === "SELECT") { if ([...el.options].some((o) => o.value === String(val))) { el.value = val; n++; } }
          else { el.value = val; n++; }
          el.style.borderColor = "var(--green)";
        }
      }
      toast(n ? `تم تعبئة ${n} حقول تلقائياً، راجعها ثم احفظ` : "ما قدرت أقرأ بيانات واضحة من الصورة");

// ===== M5: two-factor authentication (TOTP, e.g. Google Authenticator / Microsoft Authenticator) =====
const MFA = {
  async factors() { const { data } = await sb.auth.mfa.listFactors(); return (data?.totp ?? []).filter((f) => f.status === "verified"); },
  async box() {
    const el = $("#mfaBox"); if (!el) return;
    const f = await MFA.factors();
    el.innerHTML = `<b class="row" style="gap:6px">${ic("shield")} التحقق الثنائي</b>` + (f.length
      ? `<div class="msg ok mt">مفعّل. عند الدخول بنطلب منك رمز من تطبيق المصادقة.</div><button class="btn sm danger mt" onclick="MFA.remove('${safeId(f[0].id)}')">إلغاء التحقق الثنائي</button>`
      : `<p class="muted small mt">يحمي حسابك لو انسرقت كلمة المرور. تحتاج تطبيق مصادقة في جوالك (Google Authenticator أو Microsoft Authenticator).${isAdmin() ? " <b>ننصح فيه بقوة لحسابات المدراء.</b>" : ""}</p>
         <button class="btn sm mt" onclick="MFA.enroll()">تفعيل التحقق الثنائي</button>`);
  },
  async enroll() {
    const old = (await sb.auth.mfa.listFactors()).data?.all ?? [];
    for (const x of old.filter((x) => x.status !== "verified")) await sb.auth.mfa.unenroll({ factorId:x.id });
    const { data, error } = await sb.auth.mfa.enroll({ factorType:"totp", friendlyName:"Yaqen " + new Date().toISOString().slice(0, 10) });
    if (error) return toast("خطأ: " + error.message);
    modal(`<div class="row"><h3 class="sp">${ic("shield")} تفعيل التحقق الثنائي</h3><button class="btn sm ghost icon" title="إغلاق" onclick="App.close()">${ic("x")}</button></div>
      <p class="small">1) افتح تطبيق المصادقة وامسح الرمز:</p>
      <div style="background:#fff;padding:10px;border-radius:12px;width:200px;margin:10px auto"><img src="${esc(data.totp.qr_code)}" style="width:180px;height:180px"></div>
      <p class="muted small">أو اكتب المفتاح يدوياً: <b dir="ltr">${esc(data.totp.secret)}</b></p>
      <form onsubmit="MFA.verifyEnroll(event,'${safeId(data.id)}')"><label class="f"><span>2) اكتب الرمز المكوّن من 6 أرقام</span>
        <input class="in" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required dir="ltr"></label>
        <button class="btn pri">تأكيد</button></form>`);
  },
  async verifyEnroll(e, factorId) {
    e.preventDefault(); const code = new FormData(e.target).get("code");
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId, code });
    if (error) return toast("الرمز غير صحيح، جرّب الرمز الجديد");
    App.close(); toast("تم تفعيل التحقق الثنائي"); MFA.box();
  },
  async remove(factorId) {
    if (!confirmT("إلغاء التحقق الثنائي؟ حسابك بيصير محمي بكلمة المرور فقط.")) return;
    const { error } = await sb.auth.mfa.unenroll({ factorId });
    if (error) return toast(error.message.includes("aal2") ? "سجّل خروج وادخل مرة ثانية برمز التحقق، ثم ألغِه" : "خطأ: " + error.message);
    toast("تم الإلغاء"); MFA.box();
  },
  // login step-up: boot calls this when the account has a verified factor but this session is aal1
  challenge(factorId, message) {
    $("#app").innerHTML = `<div class="auth"><div class="auth-card"><div style="text-align:center;color:var(--green)">${ic("shield", "xl")}</div>
      <p class="mt mb">اكتب الرمز من تطبيق المصادقة في جوالك</p>
      <form onsubmit="MFA.verifyLogin(event,'${safeId(factorId)}')">
        <input class="in mb" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required dir="ltr" autofocus>
        <button class="btn pri full">دخول</button></form>
      ${message ? `<div class="msg err">${esc(message)}</div>` : ""}
      <button class="btn ghost full mt" onclick="App.logout()">تسجيل الخروج</button>
      <div class="powered">مدعوم بتقنية <b style="color:var(--green)">يقين AI</b></div></div></div>`;
  },
  async verifyLogin(e, factorId) {
    e.preventDefault(); const code = new FormData(e.target).get("code");
    const b = e.target.querySelector("button"); b.disabled = true;
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId, code });
    if (error) return MFA.challenge(factorId, "الرمز غير صحيح أو انتهت صلاحيته");
    boot((await sb.auth.getSession()).data.session);
  },
};
window.MFA = MFA;

// ===== Boot =====
async function boot(session) {
  S.session = session;
  if (!session) { await loadPublic(); return renderAuth(); }
  $("#app").innerHTML = `<div class="auth"><span class="spin" style="width:32px;height:32px;color:var(--green)"></span></div>`;
  let acct = null;
  try { acct = await rpc("my_account"); } catch (err) { reportError(err?.message || err, { at:"my_account" }); }
  if (!acct) return blocked("ما قدرنا نلقى ملفك في المنصة. تواصل مع مدير شركتك.");
  if (acct.status === "pending") return blocked(`تم إنشاء حسابك في ${acct.company_name || "الشركة"}، وهو الحين بانتظار موافقة مدير الشركة. بيحدد قسمك ويفعّل حسابك، بعدها تقدر تدخل.`, "hourglass");
  if (acct.status === "disabled") return blocked("حسابك موقوف حالياً. تواصل مع مدير شركتك.");
  // M5: an account with a verified authenticator must enter the code before using the platform
  const { data:aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal?.nextLevel === "aal2" && aal.currentLevel !== "aal2") {
    const f = await MFA.factors();
    if (f.length) return MFA.challenge(f[0].id);
  }
  S.mfaNeeded = !!acct.mfa_required && acct.aal !== "aal2" && aal?.currentLevel !== "aal2";
  await loadMe();
  if (!S.me) return blocked("ما قدرنا نلقى ملفك في المنصة. تواصل مع مدير شركتك.");
  if (isSuper()) {
    await loadCompanies();
    let saved = null; try { saved = localStorage.getItem("yq_cid"); } catch {}
    if (saved && S.companies.some((c) => c.id === saved)) { S.cid = saved; await loadAll(); S.view = "home"; }
    else { S.cid = null; S.view = "platform"; }
    return renderShell();
  }
  S.cid = S.me.company_id;
  await loadAll();
  if (!S.company) return blocked("حساب شركتك موقوف حالياً. تواصل مع مدير شركتك أو مع يقين.");
  renderShell();
}
function blocked(m, icon = "pause") {
  $("#app").innerHTML = `<div class="auth"><div class="auth-card" style="text-align:center"><div style="color:var(--green)">${ic(icon, "xl")}</div><p class="mt">${esc(m)}</p>
    <button class="btn mt" onclick="App.logout()">تسجيل الخروج</button><div class="powered">مدعوم بتقنية <b style="color:var(--green)">يقين AI</b></div></div></div>`;
}
let started = false;
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === "TOKEN_REFRESHED") { S.session = session; return; }
  if (ev === "PASSWORD_RECOVERY" || (ev === "INITIAL_SESSION" && /type=recovery/.test(location.hash))) {
    S.recovering = true; S.session = session; S.authTab = "reset"; started = true; setTimeout(() => renderAuth(), 0); return;
  }
  if (S.recovering && ev === "SIGNED_IN") return;
  if (ev === "INITIAL_SESSION" || ev === "SIGNED_IN" || ev === "SIGNED_OUT") {
    if (ev === "SIGNED_IN" && started && S.session?.user?.id === session?.user?.id) return;
    started = true; setTimeout(() => boot(session), 0);
  }
});
</script>
</body>
