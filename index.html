<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<!-- H1 defence in depth: scripts only from this site + the supabase-js CDN; network only to our Supabase project.
     Even if some text were ever interpreted as code, it could not send data anywhere else. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://zalfumkzlnpygvemxayb.supabase.co; media-src 'self' blob: https://zalfumkzlnpygvemxayb.supabase.co; connect-src https://zalfumkzlnpygvemxayb.supabase.co wss://zalfumkzlnpygvemxayb.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>منصة الشركة | يقين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220; --panel:#111A2E; --panel2:#16213A; --line:#22304F; --text:#E8EEF8; --muted:#8C9BB8;
  --green:#22C55E; --green2:#16A34A; --greenSoft:rgba(34,197,94,.12);
  --red:#EF4444; --redSoft:rgba(239,68,68,.12); --amber:#F59E0B; --amberSoft:rgba(245,158,11,.12);
  --blue:#3B82F6; --blueSoft:rgba(59,130,246,.12); --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--green)}
.hidden{display:none!important}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 500px at 80% -10%,rgba(34,197,94,.15),transparent),var(--bg)}
.auth-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:cover}
.brand h1{font-size:20px;font-weight:700}
.brand small{color:var(--muted);font-size:12px;display:block}
.tabs{display:flex;background:var(--panel2);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--bg);color:var(--text)}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
.in:focus{border-color:var(--green)}
textarea.in{min-height:90px;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--panel2);display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn.pri{background:var(--green);color:#04150A}
.btn.danger{background:var(--redSoft);color:var(--red)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.ai{background:linear-gradient(135deg,#22C55E,#0EA5E9);color:#03130A}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:13px;margin-top:10px;padding:10px;border-radius:10px;background:var(--panel2)}
.msg.err{background:var(--redSoft);color:#FCA5A5}
.msg.ok{background:var(--greenSoft);color:#86EFAC}
.powered{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}

/* shell */
.shell{display:flex;min-height:100vh}
.side{width:250px;background:var(--panel);border-left:1px solid var(--line);padding:18px 12px;position:fixed;top:0;bottom:0;right:0;overflow-y:auto;z-index:40;transition:transform .25s}
.side .brand{padding:0 6px}
.nav button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--muted);text-align:right;font-weight:500}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.on{background:var(--greenSoft);color:var(--green)}
.nav .ico{width:22px;text-align:center}
.nav .sec{font-size:11px;color:var(--muted);opacity:.7;padding:14px 12px 4px}
.nav .cnt{margin-right:auto;background:var(--redSoft);color:var(--red);font-size:11px;padding:1px 7px;border-radius:20px}
.main{flex:1;margin-right:250px;min-width:0}
.top{position:sticky;top:0;z-index:30;background:rgba(11,18,32,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:12px}
.top h2{font-size:18px;font-weight:700;flex:1}
.me{display:flex;align-items:center;gap:8px;cursor:pointer}
.av{width:36px;height:36px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;overflow:hidden;font-weight:700;color:var(--green);flex-shrink:0;font-size:14px}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:84px;height:84px;font-size:30px}
.menu-btn{display:none;border:0;background:var(--panel2);width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer}
.content{padding:22px;max-width:1200px}
.overlay{display:none}

@media(max-width:900px){
  .side{transform:translateX(100%)}
  .side.open{transform:none}
  .overlay.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
  .main{margin-right:0}
  .menu-btn{display:grid;place-items:center}
  .content{padding:14px}
  .top{padding:10px 14px}
  .me .nm{display:none}
}

/* cards */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.kpi{cursor:pointer;transition:.15s}
.kpi:hover{border-color:var(--green)}
.kpi .v{font-size:28px;font-weight:700;line-height:1.2}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .s{font-size:12px;margin-top:4px}
.mt{margin-top:16px}.mb{margin-bottom:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.b-green{background:var(--greenSoft);color:#4ADE80}
.b-red{background:var(--redSoft);color:#F87171}
.b-amber{background:var(--amberSoft);color:#FBBF24}
.b-blue{background:var(--blueSoft);color:#60A5FA}
.list .it{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:8px;flex-shrink:0}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.bar{height:7px;background:var(--panel2);border-radius:10px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green);border-radius:10px}

/* records */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .in{flex:1;min-width:180px}
.rec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;transition:.15s}
.rec:hover{border-color:#2E4370}
.rec .t{font-weight:700;font-size:15px}
.rec .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.person{display:flex;align-items:center;gap:12px}

/* ai */
.ai-hero{background:linear-gradient(135deg,rgba(34,197,94,.14),rgba(14,165,233,.10));border:1px solid rgba(34,197,94,.35);border-radius:18px;padding:18px}
.ring{width:96px;height:96px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px}
.risk{border-right:3px solid var(--line);padding:8px 12px;margin-bottom:8px;background:var(--panel2);border-radius:8px}
.risk.h{border-right-color:var(--red)}.risk.m{border-right-color:var(--amber)}.risk.l{border-right-color:var(--blue)}
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px}
.msgs{flex:1;overflow-y:auto;padding:4px 2px 12px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:85%;padding:11px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.bub.u{align-self:flex-start;background:var(--green);color:#04150A;border-bottom-right-radius:4px}
.bub.a{align-self:flex-end;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.a ul{padding-right:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--green);color:var(--green)}
.composer{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.composer .in{flex:1}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin:0 2px;animation:bl 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}
.fab{position:fixed;left:18px;bottom:18px;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,#22C55E,#0EA5E9);font-size:24px;cursor:pointer;box-shadow:0 10px 30px rgba(34,197,94,.35);z-index:25}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal{align-items:center}}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px;border:1px solid var(--line)}
@media(min-width:700px){.sheet{border-radius:20px}}
.sheet h3{font-size:17px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:500px){.two{grid-template-columns:1fr}}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 18px;border-radius:12px;z-index:80;font-size:14px}
.spin{width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
/* cropper */
.crop-wrap{position:relative;width:min(300px,100%);aspect-ratio:1;margin:0 auto;touch-action:none;border-radius:14px;overflow:hidden;background:#000}
.crop-wrap canvas{width:100%;height:100%;display:block;cursor:grab}
.crop-ring{position:absolute;inset:0;pointer-events:none;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.55);outline:2px solid rgba(255,255,255,.8);outline-offset:-2px}
input[type=range]{width:100%;accent-color:var(--green)}
/* rooms */
.room-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.avs{display:flex}
.avs .av{width:28px;height:28px;font-size:11px;border:2px solid var(--panel);margin-left:-8px}
.m{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.m.me{align-self:flex-start;flex-direction:row}
.m.other{align-self:flex-end;flex-direction:row-reverse}
.m .av{width:30px;height:30px;font-size:12px}
.m .b{padding:9px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word;min-width:60px}
.m.me .b{background:#123524;border-color:#1E5A3A}
.m .who{font-size:12px;color:var(--green);font-weight:600;margin-bottom:2px}
.m .tm{font-size:11px;color:var(--muted);margin-top:4px}
.m img.pic{max-width:240px;max-height:260px;border-radius:10px;display:block;cursor:pointer}
.m audio{width:230px;max-width:100%;height:40px}
.fileln{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.fileln .ic{width:40px;height:40px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:20px}
.m.ai{align-self:center;max-width:95%}
.m.ai .b{background:linear-gradient(135deg,rgba(34,197,94,.14),rgba(14,165,233,.10));border-color:rgba(34,197,94,.35)}
.rec-bar{display:flex;align-items:center;gap:10px;background:var(--redSoft);color:#FCA5A5;border-radius:12px;padding:8px 12px;flex:1}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:bl 1s infinite}
.iconbtn{border:0;background:var(--panel2);width:42px;height:42px;border-radius:12px;font-size:18px;cursor:pointer;flex-shrink:0;display:grid;place-items:center}
.pick{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer}
.pick:hover{background:var(--panel2)}
.pick input{width:18px;height:18px;accent-color:var(--green)}
.tr{margin-top:7px;padding-top:7px;border-top:1px dashed rgba(255,255,255,.18);font-size:13px}
.tr div{margin-top:3px}
.tr .lg{font-size:11px;color:var(--muted);margin-left:6px}
.trbtn{background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;margin-top:4px;padding:0}
.trbtn:hover{color:var(--green)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:90;display:grid;place-items:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right}
table.t th{color:var(--muted);font-weight:500;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// ===== Settings: Supabase project of the platform =====
const SUPABASE_URL = "https://zalfumkzlnpygvemxayb.supabase.co";
const SUPABASE_KEY = "sb_publishable_IeygDMV4GdMRU4it2FfJ9A_WqP0Al09";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// ===== Error monitoring: browser errors are recorded (rate-limited server-side) in public.system_events =====
let lastErr = "";
function reportError(msg, ctx) {
  try {
    const m = String(msg || "").slice(0, 500);
    if (!m || m === lastErr || !S.session) return;
    lastErr = m;
    sb.rpc("log_client_error", { msg:m, ctx:{ view:S.view, ...ctx } }).then(() => {}, () => {});
  } catch {}
}
window.addEventListener("error", (e) => reportError(e.message, { src:e.filename, line:e.lineno }));
window.addEventListener("unhandledrejection", (e) => reportError(e.reason?.message || String(e.reason), { kind:"promise" }));

const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtNum = (n) => (n == null || n === "" ? "-" : Number(n).toLocaleString("ar-SA"));
const fmtSAR = (n) => (n == null || n === "" ? "-" : Number(n).toLocaleString("ar-SA") + " ر.س");
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const daysLeft = (d) => (d ? Math.round((new Date(d) - today()) / 86400000) : null);
const fmtDate = (d) => (d ? new Date(d).toLocaleDateString("ar-SA-u-ca-gregory", { year:"numeric", month:"short", day:"numeric" }) : "-");
// H1 rule: inside inline event handlers only validated ids or fixed keys may appear, never free text.
const safeId = (x) => (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(x ?? "")) ? String(x) : "");
const initials = (n) => (n || "?").trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("");

const S = { session:null, me:null, company:null, cid:null, companies:[], allPeople:[], settings:{ company_name:"يقين للأعمال" }, deps:[], people:[], data:{}, view:"home", param:null, chat:[], brief:null, authTab:"login", signupCo:null, urls:{}, rooms:[], roomMembers:[] };
const isSuper = () => S.me?.role === "super_admin";
const isAdmin = () => S.me?.role === "admin" || isSuper();
const depName = (id) => S.deps.find((d) => d.id === id)?.name ?? "بدون قسم";
const depByName = (n) => S.deps.find((d) => d.name === n)?.id;

// ===== Entity definitions =====
const ENT = {
  vehicles: { title:"الأسطول والمعدات", icon:"🚚", one:"مركبة / معدة", def:"الأسطول والمعدات", primary:"plate", search:["plate","kind","model","driver_name","location"],
    sub:(r) => [r.kind, r.model, r.driver_name && "السائق: " + r.driver_name].filter(Boolean).join(" · "),
    status:"status", statusColor:{ "شغالة":"b-green", "متوقفة":"b-red", "صيانة":"b-amber" },
    fields:[
      { k:"plate", l:"رقم اللوحة", req:1 }, { k:"kind", l:"النوع", ph:"ونيت، رافعة، شيول..." },
      { k:"model", l:"الموديل والسنة" }, { k:"status", l:"الحالة", t:"select", o:["شغالة","متوقفة","صيانة"] },
      { k:"driver_name", l:"اسم السائق" }, { k:"driver_phone", l:"جوال السائق" },
      { k:"location", l:"الموقع الحالي", ph:"مثال: موقع أرامكو - أبقيق" },
      { k:"registration_expiry", l:"انتهاء الاستمارة", t:"date", exp:1 },
      { k:"insurance_expiry", l:"انتهاء التأمين", t:"date", exp:1 },
      { k:"license_expiry", l:"انتهاء رخصة السائق", t:"date", exp:1 },
      { k:"notes", l:"ملاحظات", t:"textarea", wide:1 } ] },
  projects: { title:"المشاريع", icon:"🏗️", one:"مشروع", def:"المشاريع", primary:"name", search:["name","client","po_number"],
    sub:(r) => [r.client, r.po_number && "PO: " + r.po_number].filter(Boolean).join(" · "),
    status:"status", statusColor:{ "جاري":"b-blue", "متأخر":"b-red", "مكتمل":"b-green", "معلق":"b-amber" }, progress:"progress",
    fields:[
      { k:"name", l:"اسم المشروع", req:1, wide:1 }, { k:"client", l:"العميل" }, { k:"po_number", l:"رقم أمر الشراء (PO)" },
      { k:"contract_value", l:"قيمة العقد (ر.س)", t:"number" }, { k:"progress", l:"نسبة الإنجاز %", t:"number" },
      { k:"status", l:"الحالة", t:"select", o:["جاري","متأخر","مكتمل","معلق"] },
      { k:"start_date", l:"تاريخ البداية", t:"date" }, { k:"end_date", l:"تاريخ التسليم", t:"date", deadline:1 },
      { k:"notes", l:"ملاحظات", t:"textarea", wide:1 } ] },
  legal_cases: { title:"القضايا", icon:"⚖️", one:"قضية", def:"القانونية", primary:"title", search:["title","case_number","court","opponent","lawyer"],
    sub:(r) => [r.case_number && "رقم " + r.case_number, r.court, r.lawyer && "المحامي: " + r.lawyer].filter(Boolean).join(" · "),
    status:"status", statusColor:{ "مفتوحة":"b-blue", "قيد النظر":"b-amber", "مؤجلة":"b-amber", "مغلقة":"b-green" },
    fields:[
      { k:"title", l:"عنوان القضية", req:1, wide:1 }, { k:"case_number", l:"رقم القضية" }, { k:"court", l:"المحكمة / الجهة" },
      { k:"opponent", l:"الطرف الآخر" }, { k:"lawyer", l:"المحامي المسؤول" },
      { k:"status", l:"الحالة", t:"select", o:["مفتوحة","قيد النظر","مؤجلة","مغلقة"] },
      { k:"next_hearing", l:"الجلسة القادمة", t:"date", hearing:1 },
      { k:"last_update", l:"آخر المستجدات", t:"textarea", wide:1 } ] },

// The API returns at most 1,000 rows per request. fetchAll pages through with .range() so nothing is silently cut off.
// Large business tables (vehicles, invoices, ...) are never loaded whole: they are paged on the server (loadPage).
const PAGE_SIZE = 50;
async function fetchAll(build, chunk = 1000) {
  let out = [], from = 0;
  for (;;) {
    const { data, error } = await build().range(from, from + chunk - 1);
    if (error) throw error;
    out = out.concat(data ?? []);
    if (!data || data.length < chunk) return out;
    from += chunk;
  }
}
const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; };

// one server page of a business table: filters + search + count are done by the database
function pageState(k) {
  S.page = S.page || {};
  return (S.page[k] = S.page[k] || { n:0, q:"", status:"", dep:"", rows:null, total:0, loading:false, key:"" });
}
const searchSafe = (q) => q.replace(/[,()*%\\:"']/g, " ").trim().slice(0, 60);
async function loadPage(k) {
  const st = pageState(k), cfg = ENT[k];
  const key = JSON.stringify([S.cid, st.n, st.q, st.status, st.dep]);
  if (st.loading || (st.rows && st.key === key)) return;
  st.loading = true;
  let q = sb.from(k).select("*", { count:"exact" }).eq("company_id", S.cid);
  if (st.status && cfg.status) q = q.eq(cfg.status, st.status);
  if (st.dep) q = q.eq("department_id", st.dep);
  const term = searchSafe(st.q);
  if (term) q = q.or(cfg.search.map((c) => `${c}.ilike.*${term}*`).join(","));
  const { data, count, error } = await q.order("updated_at", { ascending:false }).order("id").range(st.n * PAGE_SIZE, st.n * PAGE_SIZE + PAGE_SIZE - 1);
  st.loading = false;
  if (error) { toast("خطأ في التحميل: " + error.message); st.rows = []; st.total = 0; }
  else { st.rows = data ?? []; st.total = count ?? 0; }
  st.key = key;
  if (S.view === k) renderView();
}
async function getRecord(k, id) {
  const hit = (S.page?.[k]?.rows ?? []).find((r) => r.id === id);
  if (hit) return hit;
  const { data } = await sb.from(k).select("*").eq("id", id).single();
  return data;
}

function toast(t) {

async function resizeImage(file, max = 1600, q = 0.85) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = img.width * s; c.height = img.height * s;
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise((res) => c.toBlob(res, "image/jpeg", q));
}
const blobToB64 = (b) => new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.readAsDataURL(b); });

async function uploadImage(file, folder) {
  const blob = await resizeImage(file, 600, 0.85);
  const path = `${folder}/${Date.now()}.jpg`;
  const { error } = await sb.storage.from("avatars").upload(path, blob, { contentType:"image/jpeg", upsert:true });
  if (error) throw error;
  return sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
}

async function ai(body) {

    try { const j = await error.context.json(); msg = j.error || msg; } catch {}
    if (msg === "NO_KEY") throw new Error("الذكاء الاصطناعي غير مفعّل بعد. يحتاج المسؤول إضافة مفتاح ANTHROPIC_API_KEY في إعدادات Supabase.");
    throw new Error(msg);
  }
  return data;
}

// ===== Alerts (computed by the database over ALL rows: public.company_alerts) =====
function alertText(a) {
  const d = a.days;
  switch (a.kind) {
    case "expiry":  return d < 0 ? `${a.label}: منتهي منذ ${-d} يوم` : `${a.label}: بعد ${d} يوم`;
    case "hearing": return `جلسة قضية "${a.label}" بعد ${d} يوم`;
    case "overdue": return `فاتورة ${a.label} متأخرة ${-d} يوم (${fmtSAR(a.amount)})`;
    case "late":    return `مشروع "${a.label}" متأخر أو تجاوز موعد التسليم`;
    case "urgent":  return `طلب عاجل: ${a.label}`;
    case "note":    return `ملاحظة مدير بانتظار الرد: ${a.label}`;
    default:        return a.label;
  }
}
function computeAlerts() {
  return (S.alerts ?? []).map((a) => ({ lvl:a.level, text:alertText(a), view:a.entity === "manager_notes" ? "notes" : a.entity, dep:a.department_id, id:a.entity_id }));
}

    <div class="row mt"><button class="btn pri" id="cropOk">حفظ الصورة</button><button class="btn ghost" onclick="App.close()">إلغاء</button></div>`);
  const cv = $("#cropCv"), ctx = cv.getContext("2d"), N = 600;
  const img = new Image();
  let base = 1, zoom = 1, ox = 0, oy = 0, drag = null;
  const w = () => img.width * base * zoom, h = () => img.height * base * zoom;
  const clamp = () => { ox = Math.min(0, Math.max(N - w(), ox)); oy = Math.min(0, Math.max(N - h(), oy)); };
  const draw = () => { clamp(); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, N, N); ctx.drawImage(img, ox, oy, w(), h()); };
  img.onload = () => { base = Math.max(N / img.width, N / img.height); ox = (N - w()) / 2; oy = (N - h()) / 2; draw(); };
  img.src = url;
  const ratio = () => N / cv.clientWidth;
  cv.addEventListener("pointerdown", (e) => { drag = { x:e.clientX, y:e.clientY }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", (e) => { if (!drag) return; ox += (e.clientX - drag.x) * ratio(); oy += (e.clientY - drag.y) * ratio(); drag = { x:e.clientX, y:e.clientY }; draw(); });
  cv.addEventListener("pointerup", () => (drag = null));
  cv.addEventListener("pointercancel", () => (drag = null));
  $("#cropZoom").addEventListener("input", (e) => {
    const nz = Number(e.target.value);
    const cx = (N / 2 - ox) / (base * zoom), cy = (N / 2 - oy) / (base * zoom);
    zoom = nz; ox = N / 2 - cx * base * zoom; oy = N / 2 - cy * base * zoom; draw();
  });
  $("#cropOk").addEventListener("click", () => {
    const out = document.createElement("canvas"); out.width = 400; out.height = 400;
    out.getContext("2d").drawImage(cv, 0, 0, N, N, 0, 0, 400, 400);
    $("#cropOk").disabled = true; $("#cropOk").innerHTML = `<span class="spin"></span>`;
    out.toBlob((b) => { URL.revokeObjectURL(url); onDone(b); }, "image/jpeg", 0.9);
  });
}

  const { error } = await sb.storage.from("avatars").upload(path, blob, { contentType:"image/jpeg", upsert:true });
  if (error) throw error;
  return sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;

const needsTr = (t) => /[\u0679\u0688\u0691\u06BA\u06BE\u06C1\u06D2\u06D3]/.test(t) || /[A-Za-z]{3,}/.test(t);
const LANGS = [["ar", "🇸🇦 عربي"], ["ur", "🇵🇰 اردو"], ["en", "🇬🇧 English"]];
function trHtml(m) {
  const t = m.translation;
  if (t && (t.ar || t.en)) {
    const rows = LANGS.filter(([k]) => t[k] && t[k].trim() !== (m.body || "").trim());
    return `<div class="tr">${t.lang && t.lang !== "ar" ? `<div class="lg">🌐 مترجم من ${esc(t.lang_name_ar || t.lang)}</div>` : ""}${rows.map(([k, l]) => `<div><div class="lg">${l}</div><div dir="${k === "en" ? "ltr" : "rtl"}">${esc(t[k])}</div></div>`).join("")}</div>`;
  }
  if (S.trPending?.[m.id]) return `<div class="tr"><span class="spin"></span> <span class="lg">جاري الترجمة...</span></div>`;
  return `<div><button class="trbtn" onclick="Room.translate('${safeId(m.id)}')">🌐 ترجمة</button></div>`;
}
function msgHtml(m) {
  const mine = m.user_id === S.me?.id, p = personById(m.user_id);
  const url = m.file_path ? S.urls[m.file_path] : null;

  if (m.kind === "text") inner = esc(m.body) + trHtml(m);
  else if (m.kind === "ai") inner = `<div class="muted small mb">✨ ملخص يقين الذكي</div>${md(m.body || "")}`;

  else if (m.kind === "audio") inner = url ? `<audio controls preload="metadata" src="${esc(url)}"></audio>` : `<span class="spin"></span> رسالة صوتية`;
  else inner = `<a class="fileln" href="${esc(url || "#")}" target="_blank" rel="noopener"><span class="ic">📄</span><span><b>${esc(m.file_name)}</b><div class="muted small">${m.file_size ? fmtSize(m.file_size) : ""} · اضغط للفتح</div></span></a>`;

  return `<div class="m ${mine ? "me" : "other"}">${mine ? "" : avatar(p)}<div><div class="b">${mine ? "" : `<div class="who">${esc(p?.full_name || "مستخدم")}</div>`}${inner}</div><div class="tm">${fmtTime(m.created_at)}</div></div></div>`;
}

const Room = {
  id:null, ch:null, rec:null,
  async open(id) {
    if (this.id === id && S.roomMsgs?.[id]) { this.render(); return; }
    this.leave(); this.id = id;
    S.roomMsgs = S.roomMsgs || {};
    const { data } = await sb.from("room_messages").select("*").eq("room_id", id).order("created_at").limit(500);
    S.roomMsgs[id] = data ?? [];
    this.render();
    this.ch = sb.channel("room-" + id)
      .on("postgres_changes", { event:"INSERT", schema:"public", table:"room_messages", filter:`room_id=eq.${id}` }, (p) => this.add(p.new))
      .on("postgres_changes", { event:"UPDATE", schema:"public", table:"room_messages", filter:`room_id=eq.${id}` }, (p) => { const l = S.roomMsgs[id] || []; const i = l.findIndex((x) => x.id === p.new.id); if (i >= 0) { l[i] = { ...l[i], ...p.new }; this.render(); } })
      .on("postgres_changes", { event:"DELETE", schema:"public", table:"room_messages", filter:`room_id=eq.${id}` }, (p) => { S.roomMsgs[id] = (S.roomMsgs[id] || []).filter((m) => m.id !== p.old.id); this.render(); })
      .subscribe();
  },
  leave() { if (this.ch) { sb.removeChannel(this.ch); this.ch = null; } this.id = null; this.stopRec(true); },
  add(m) {
    const list = S.roomMsgs[m.room_id] = S.roomMsgs[m.room_id] || [];
    if (list.some((x) => x.id === m.id)) return;
    list.push(m); if (this.id === m.room_id) this.render();
  },
  async render() {
    const box = $("#msgs"); if (!box || !this.id) return;
    const list = S.roomMsgs[this.id] || [];
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    box.innerHTML = list.length ? list.map(msgHtml).join("") : `<div class="empty">ابدأ النقاش 👋<br><span class="small">تقدر ترسل نص، صور، مستندات، أو رسالة صوتية 🎤</span></div>`;
    if (atBottom || !box.dataset.init) { box.scrollTop = box.scrollHeight; box.dataset.init = "1"; }
    const need = list.filter((m) => m.file_path && !S.urls[m.file_path]).map((m) => m.file_path);
    if (need.length) {
      const { data } = await sb.storage.from("rooms").createSignedUrls(need, 60 * 60 * 6);
      (data ?? []).forEach((d) => { if (d.signedUrl) S.urls[d.path] = d.signedUrl; });
      if ((data ?? []).some((d) => d.signedUrl)) this.render();
    }
  },
  async post(row) {
    const { data, error } = await sb.from("room_messages").insert({ room_id:this.id, ...row }).select().single();
    if (error) { toast("خطأ: " + error.message); return null; }
    this.add(data); return data;
  },
  async send(e) {
    e.preventDefault(); const i = $("#rmInput"); const t = i.value.trim(); if (!t) return;
    i.value = ""; const m = await this.post({ kind:"text", body:t }); i.focus();
    if (m && needsTr(t)) this.translate(m.id);
  },
  async upload(blob, name, mime) {
    if (blob.size > 50 * 1048576) { toast("الملف أكبر من ٥٠ ميجا"); return null; }
    const safe = name.replace(/[^\w.\-]+/g, "_").slice(-60) || "file";
    const path = `${this.id}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}-${safe}`;
    const { error } = await sb.storage.from("rooms").upload(path, blob, { contentType:mime || "application/octet-stream" });
    if (error) { toast("خطأ في الرفع: " + error.message); return null; }
    return path;
  },
  async files(input) {
    const files = [...input.files]; input.value = "";
    for (const f of files) {
      toast(`جاري رفع ${f.name}...`);
      const isImg = f.type.startsWith("image/") && !/svg/.test(f.type);
      const blob = isImg ? await resizeImage(f, 1800, 0.85).catch(() => f) : f;
      const path = await this.upload(blob, isImg ? f.name.replace(/\.\w+$/, "") + ".jpg" : f.name, isImg ? "image/jpeg" : f.type);
      if (path) await this.post({ kind:isImg ? "image" : "file", file_path:path, file_name:f.name, file_size:blob.size, mime:isImg ? "image/jpeg" : f.type });
    }
  },
  async record() {
    if (this.rec) return this.stopRec(false);
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast("جهازك ما يدعم التسجيل الصوتي من المتصفح");
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
    catch { return toast("اسمح للمتصفح باستخدام المايكروفون"); }
    const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/aac"].find((t) => MediaRecorder.isTypeSupported?.(t)) || "";
    const mr = new MediaRecorder(stream, type ? { mimeType:type } : undefined);
    const chunks = []; const started = Date.now();
    mr.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    this.rec = { mr, stream, chunks, started, cancel:false };
    mr.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      const r = this.rec; this.rec = null; clearInterval(this.timer); this.recUI(false);
      if (r.cancel || !chunks.length) return;
      const mime = mr.mimeType || type || "audio/mp4";
      const blob = new Blob(chunks, { type:mime });
      const ext = /webm/.test(mime) ? "webm" : "m4a";
      const secs = Math.round((Date.now() - started) / 1000);
      const path = await this.upload(blob, `voice.${ext}`, mime);
      if (path) await this.post({ kind:"audio", file_path:path, file_name:`رسالة صوتية (${secs} ث)`, file_size:blob.size, mime });
    };
    mr.start(); this.recUI(true);
    this.timer = setInterval(() => { const s = Math.round((Date.now() - started) / 1000); const el = $("#recT"); if (el) el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }, 500);
  },
  stopRec(cancel) { if (this.rec) { this.rec.cancel = cancel; try { this.rec.mr.stop(); } catch {} } },
  recUI(on) {
    const c = $("#composer"); if (!c) return;
    const form = c.querySelector("form"), mic = $("#micBtn");
    let bar = $("#recBar");
    if (on) {
      form.classList.add("hidden");
      if (!bar) { bar = document.createElement("div"); bar.id = "recBar"; bar.className = "rec-bar";
        bar.innerHTML = `<span class="rec-dot"></span><span>جاري التسجيل <b id="recT">0:00</b></span><span class="sp"></span><button class="btn sm ghost" onclick="Room.stopRec(true)">إلغاء</button>`;
        c.appendChild(bar); }
      mic.textContent = "📤"; mic.title = "إرسال التسجيل";
    } else { form?.classList.remove("hidden"); bar?.remove(); if (mic) { mic.textContent = "🎤"; mic.title = "رسالة صوتية"; } }
  },
  async translate(mid) {
    const list = S.roomMsgs[this.id] || []; const m = list.find((x) => x.id === mid); if (!m) return;
    S.trPending = S.trPending || {}; S.trPending[mid] = true; this.render();
    try { const { translation } = await ai({ mode:"translate", message_id:mid }); if (translation) m.translation = translation; }
    catch (err) { toast(err.message); }
    delete S.trPending[mid]; this.render();
  },
  zoom(url) {
    const d = document.createElement("div"); d.className = "lightbox"; d.innerHTML = `<img src="${esc(url)}">`;
    d.onclick = () => d.remove(); document.body.appendChild(d);
  },
};

      ${S.chat.map((m) => `<div class="bub ${m.role === "user" ? "u" : "a"}">${m.role === "user" ? esc(m.content) : md(m.content)}</div>`).join("")}

    </div>

function md(t) {
  let h = esc(t);
  h = h.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  h = h.replace(/^#{1,4}\s*(.+)$/gm, "<b>$1</b>");
  h = h.replace(/^\s*[-•*]\s+(.+)$/gm, "• $1");
  return h;
}

     <button class="btn pri mt" onclick="App.edit('${k}')">+ إضافة ${cfg.one}</button>
     ${AI_EXTRACT.includes(k) ? `<div class="small mt">أو صوّر المستند وخل الذكاء الاصطناعي يعبّي البيانات ✨</div>` : ""}</div>`}`;

function recCard(k, r) {
  const cfg = ENT[k];
  const badges = [];
  if (cfg.status && r[cfg.status]) badges.push(`<span class="badge ${cfg.statusColor?.[r[cfg.status]] || ""}">${esc(r[cfg.status])}</span>`);
  if (k === "requests" && r.priority === "عاجل") badges.push(`<span class="badge b-red">عاجل</span>`);
  for (const f of cfg.fields) {
    if (f.t !== "date" || !r[f.k]) continue;
    const d = daysLeft(r[f.k]);
    let cls = "";
    if (f.exp) cls = d < 0 ? "b-red" : d <= 30 ? "b-amber" : "";
    if (f.hearing && r.status !== "مغلقة") cls = d >= 0 && d <= 14 ? "b-amber" : "";
    if (f.due && r.status !== "مدفوعة") cls = d < 0 ? "b-red" : d <= 7 ? "b-amber" : "";
    if (f.deadline && r.status !== "مكتمل") cls = d < 0 ? "b-red" : "";
    if (f.exp || f.hearing || f.due || f.deadline) badges.push(`<span class="badge ${cls}">${f.l}: ${fmtDate(r[f.k])}${f.exp && d < 0 ? " (منتهي)" : ""}</span>`);
  }
  if (isAdmin()) badges.push(`<span class="badge">${esc(depName(r.department_id))}</span>`);
  return `<div class="rec" onclick="App.edit('${k}','${safeId(r.id)}')">
    <div class="t">${esc(r[cfg.primary])}</div>
    ${cfg.sub(r) ? `<div class="muted small">${esc(cfg.sub(r))}</div>` : ""}
    ${k === "vehicles" && r.location ? `<div class="small">📍 ${esc(r.location)}</div>` : ""}
    ${k === "legal_cases" && r.last_update ? `<div class="small" style="margin-top:4px">${esc(r.last_update.slice(0, 120))}</div>` : ""}
    ${cfg.progress ? `<div class="bar"><i style="width:${r.progress || 0}%"></i></div><div class="muted small">${r.progress || 0}% · ${fmtSAR(r.contract_value)}</div>` : ""}
    <div class="meta">${badges.join("")}</div></div>`;
}

  async save(e, k, id) {

    if (k === "projects" && row.progress != null) row.progress = Math.max(0, Math.min(100, Math.round(row.progress)));
    row.department_id = fd.get("department_id") || null;

    const q = id ? sb.from(k).update(row).eq("id", id) : sb.from(k).insert({ ...row, company_id:S.cid });

  async scan(k, input) {
    const file = input.files[0]; if (!file) return;
    const btn = $("#scanBtn"); const old = btn.innerHTML;
    btn.innerHTML = `<span class="spin"></span> يقين يقرأ المستند...`;
    try {
      const blob = await resizeImage(file, 1600, 0.85);
      const { fields } = await ai({ mode:"extract", target:k, image:await blobToB64(blob), media_type:"image/jpeg" });
      let n = 0;
      for (const [key, val] of Object.entries(fields || {})) {
        const el = document.querySelector(`#ef [name="${key}"]`);
        if (el && val !== null && val !== "") {
          if (el.tagName === "SELECT") { if ([...el.options].some((o) => o.value === String(val))) { el.value = val; n++; } }
          else { el.value = val; n++; }
          el.style.borderColor = "var(--green)";
        }
      }
      toast(n ? `✨ تم تعبئة ${n} حقول تلقائياً، راجعها ثم احفظ` : "ما قدرت أقرأ بيانات واضحة من الصورة");
      btn.innerHTML = old;
    } catch (err) { btn.innerHTML = old; toast(err.message); }
  },

  async brief() {
    const b = $("#briefBtn"); if (b) { b.disabled = true; b.innerHTML = `<span class="spin"></span> يقين يحلل بيانات الشركة...`; }

  async ask(q, e) {
    if (e) e.preventDefault();
    const text = (q ?? $("#q")?.value ?? "").trim(); if (!text || S.chatBusy) return;
    const history = [...S.chat];
    S.chat.push({ role:"user", content:text }); S.chatBusy = true; renderView();
    try { const { answer } = await ai({ mode:"chat", question:text, history }); S.chat.push({ role:"assistant", content:answer }); }
    catch (err) { S.chat.push({ role:"assistant", content:"⚠️ " + err.message }); }
    S.chatBusy = false; if (S.view === "ai") { renderView(); $("#q")?.focus(); }
  },

    if (id) {
      const { error } = await sb.from("rooms").update(row).eq("id", id);
      if (error) { btn.disabled = false; return toast("خطأ: " + error.message); }
      const cur = S.roomMembers.filter((m) => m.room_id === id).map((m) => m.user_id).filter((u) => u !== S.me.id);
      const add = chosen.filter((u) => !cur.includes(u)), rem = cur.filter((u) => !chosen.includes(u));
      if (add.length) await sb.from("room_members").insert(add.map((u) => ({ room_id:id, user_id:u })));
      if (rem.length) await sb.from("room_members").delete().eq("room_id", id).in("user_id", rem);
    } else {
      const { data, error } = await sb.from("rooms").insert({ ...row, company_id:S.cid }).select().single();
      if (error) { btn.disabled = false; return toast("خطأ: " + error.message); }
      rid = data.id;
      if (chosen.length) { const r2 = await sb.from("room_members").insert(chosen.map((u) => ({ room_id:rid, user_id:u }))); if (r2.error) toast("خطأ: " + r2.error.message); }
    }
    App.close(); await loadAll(); App.go("room", rid); toast(id ? "تم الحفظ ✅" : "تم إنشاء الغرفة ✅");
  },
  async roomStatus(id, status) {
    const { error } = await sb.from("rooms").update({ status }).eq("id", id);
    if (error) return toast("خطأ: " + error.message);
    App.close(); await loadAll(); renderShell();
  },
  async delRoom(id) {
    if (!confirm("حذف الغرفة وكل رسائلها نهائياً؟")) return;
    const msgs = (S.roomMsgs?.[id] ?? []).filter((m) => m.file_path).map((m) => m.file_path);
    if (msgs.length) await sb.storage.from("rooms").remove(msgs);
    const { error } = await sb.from("rooms").delete().eq("id", id);
    if (error) return toast("خطأ: " + error.message);
    App.close(); await loadAll(); App.go("rooms");
  },
  async leaveRoom(id) {
    if (!confirm("تبي تغادر الغرفة؟")) return;
    await sb.from("room_members").delete().eq("room_id", id).eq("user_id", S.me.id);
    App.close(); await loadAll(); App.go("rooms");
  },
  async roomSummary(id) {
    const b = $("#sumBtn"); if (b) { b.disabled = true; b.innerHTML = `<span class="spin"></span> يلخّص...`; }
    try {
      const { text } = await ai({ mode:"room_summary", room_id:id });
      S.lastSummary = text;
      modal(`<div class="row"><h3 class="sp">✨ ملخص النقاش</h3><button class="btn sm ghost" onclick="App.close()">✕</button></div>
        <div style="white-space:pre-wrap;line-height:1.9">${md(text)}</div>
        <div class="row mt"><button class="btn pri" onclick="App.postSummary()">📌 انشر الملخص في الغرفة</button><button class="btn ghost" onclick="App.close()">إغلاق</button></div>`);
    } catch (err) { toast(err.message); }
    if (b) { b.disabled = false; b.innerHTML = "✨ لخّص النقاش"; }
  },
  async postSummary() { App.close(); await Room.post({ kind:"ai", body:S.lastSummary }); },
  async saveProfile(e) {
    e.preventDefault(); const f = new FormData(e.target);
    const row = { full_name:f.get("full_name"), job_title:f.get("job_title") || null, phone:f.get("phone") || null };
    if (f.has("department_id") && (isAdmin() || !S.me.department_id)) row.department_id = f.get("department_id") || null;
    const { error } = await sb.from("profiles").update(row).eq("id", S.me.id);
    if (error) return toast("خطأ: " + error.message);
    toast("تم الحفظ ✅"); await reload();
  },
  async saveSettings(e) {
    e.preventDefault(); const f = new FormData(e.target);
    const { error } = await sb.from("companies").update({ name:f.get("company_name") }).eq("id", S.cid);
    if (error) return toast("خطأ: " + error.message);
    toast("تم الحفظ ✅"); await reload();
  },
  async logo(input) {
    const file = input.files[0]; if (!file) return;
    try { const url = await uploadImage(file, S.me.id + "/logo"); await sb.from("companies").update({ logo_url:url }).eq("id", S.cid); await reload(); toast("تم رفع الشعار ✅"); }
    catch (err) { toast("خطأ: " + err.message); }
  },
  async addDept(e) {
    e.preventDefault(); const f = new FormData(e.target);
    const { error } = await sb.from("departments").insert({ company_id:S.cid, name:f.get("name"), icon:f.get("icon") || "🏢" });
    if (error) return toast("خطأ: " + error.message);
    await reload();
  },
  async delDept(id) {
    if (!confirm("حذف القسم؟ الموظفين والسجلات فيه بتصير بدون قسم.")) return;
    await sb.from("departments").delete().eq("id", id); await reload();
  },
};

// ===== M5: two-factor authentication (TOTP, e.g. Google Authenticator / Microsoft Authenticator) =====
const MFA = {
  async factors() { const { data } = await sb.auth.mfa.listFactors(); return (data?.totp ?? []).filter((f) => f.status === "verified"); },
  async box() {
    const el = $("#mfaBox"); if (!el) return;
    const f = await MFA.factors();
    el.innerHTML = `<b>🛡️ التحقق الثنائي</b>` + (f.length
      ? `<div class="msg ok mt">مفعّل ✅ عند الدخول بنطلب منك رمز من تطبيق المصادقة.</div><button class="btn sm danger mt" onclick="MFA.remove('${safeId(f[0].id)}')">إلغاء التحقق الثنائي</button>`
      : `<p class="muted small mt">يحمي حسابك لو انسرقت كلمة المرور. تحتاج تطبيق مصادقة في جوالك (Google Authenticator أو Microsoft Authenticator).${isAdmin() ? " <b>ننصح فيه بقوة لحسابات المدراء.</b>" : ""}</p>
         <button class="btn sm mt" onclick="MFA.enroll()">تفعيل التحقق الثنائي</button>`);
  },
  async enroll() {
    const old = (await sb.auth.mfa.listFactors()).data?.all ?? [];
    for (const x of old.filter((x) => x.status !== "verified")) await sb.auth.mfa.unenroll({ factorId:x.id });
    const { data, error } = await sb.auth.mfa.enroll({ factorType:"totp", friendlyName:"Yaqen " + new Date().toISOString().slice(0, 10) });
    if (error) return toast("خطأ: " + error.message);
    modal(`<div class="row"><h3 class="sp">🛡️ تفعيل التحقق الثنائي</h3><button class="btn sm ghost" onclick="App.close()">✕</button></div>
      <p class="small">1) افتح تطبيق المصادقة وامسح الرمز:</p>
      <div style="background:#fff;padding:10px;border-radius:12px;width:200px;margin:10px auto"><img src="${esc(data.totp.qr_code)}" style="width:180px;height:180px"></div>
      <p class="muted small">أو اكتب المفتاح يدوياً: <b dir="ltr">${esc(data.totp.secret)}</b></p>
      <form onsubmit="MFA.verifyEnroll(event,'${safeId(data.id)}')"><label class="f"><span>2) اكتب الرمز المكوّن من 6 أرقام</span>
        <input class="in" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required dir="ltr"></label>
        <button class="btn pri">تأكيد</button></form>`);
  },
  async verifyEnroll(e, factorId) {
    e.preventDefault(); const code = new FormData(e.target).get("code");
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId, code });
    if (error) return toast("الرمز غير صحيح، جرّب الرمز الجديد");
    App.close(); toast("تم تفعيل التحقق الثنائي ✅"); MFA.box();
  },
  async remove(factorId) {
    if (!confirm("إلغاء التحقق الثنائي؟ حسابك بيصير محمي بكلمة المرور فقط.")) return;
    const { error } = await sb.auth.mfa.unenroll({ factorId });
    if (error) return toast(error.message.includes("aal2") ? "سجّل خروج وادخل مرة ثانية برمز التحقق، ثم ألغِه" : "خطأ: " + error.message);
    toast("تم الإلغاء"); MFA.box();
  },
  // login step-up: boot calls this when the account has a verified factor but this session is aal1
  challenge(factorId, message) {
    $("#app").innerHTML = `<div class="auth"><div class="auth-card"><div style="font-size:40px;text-align:center">🛡️</div>
      <p class="mt mb">اكتب الرمز من تطبيق المصادقة في جوالك</p>
      <form onsubmit="MFA.verifyLogin(event,'${safeId(factorId)}')">
        <input class="in mb" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required dir="ltr" autofocus>
        <button class="btn pri full">دخول</button></form>
      ${message ? `<div class="msg err">${esc(message)}</div>` : ""}
      <button class="btn ghost full mt" onclick="App.logout()">تسجيل الخروج</button>
      <div class="powered">مدعوم بتقنية <b style="color:var(--green)">يقين AI</b></div></div></div>`;
  },
  async verifyLogin(e, factorId) {
    e.preventDefault(); const code = new FormData(e.target).get("code");
    const b = e.target.querySelector("button"); b.disabled = true;
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId, code });
    if (error) return MFA.challenge(factorId, "الرمز غير صحيح أو انتهت صلاحيته");
    boot((await sb.auth.getSession()).data.session);
  },
};
window.MFA = MFA;

// ===== Boot =====
async function boot(session) {
  S.session = session;
  if (!session) { await loadPublic(); return renderAuth(); }
  $("#app").innerHTML = `<div class="auth"><span class="spin" style="width:32px;height:32px;color:var(--green)"></span></div>`;
  let acct = null;
  try { acct = await rpc("my_account"); } catch (err) { reportError(err?.message || err, { at:"my_account" }); }
  if (!acct) return blocked("ما قدرنا نلقى ملفك في المنصة. تواصل مع مدير شركتك.");
  if (acct.status === "pending") return blocked(`تم إنشاء حسابك في ${acct.company_name || "الشركة"} ✅ وهو الحين بانتظار موافقة مدير الشركة. بيحدد قسمك ويفعّل حسابك، بعدها تقدر تدخل.`, "⏳");
  if (acct.status === "disabled") return blocked("حسابك موقوف حالياً. تواصل مع مدير شركتك.");
  // M5: an account with a verified authenticator must enter the code before using the platform
  const { data:aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal?.nextLevel === "aal2" && aal.currentLevel !== "aal2") {
    const f = await MFA.factors();
    if (f.length) return MFA.challenge(f[0].id);
  }
  S.mfaNeeded = !!acct.mfa_required && acct.aal !== "aal2" && aal?.currentLevel !== "aal2";
  await loadMe();
  if (!S.me) return blocked("ما قدرنا نلقى ملفك في المنصة. تواصل مع مدير شركتك.");
  if (isSuper()) {
    await loadCompanies();
    let saved = null; try { saved = localStorage.getItem("yq_cid"); } catch {}
    if (saved && S.companies.some((c) => c.id === saved)) { S.cid = saved; await loadAll(); S.view = "home"; }
    else { S.cid = null; S.view = "platform"; }
    return renderShell();
  }
  S.cid = S.me.company_id;
  await loadAll();
  if (!S.company) return blocked("حساب شركتك موقوف حالياً. تواصل مع مدير شركتك أو مع يقين.");
  renderShell();
}
function blocked(m, icon = "⏸") {
  $("#app").innerHTML = `<div class="auth"><div class="auth-card" style="text-align:center"><div style="font-size:40px">${esc(icon)}</div><p class="mt">${esc(m)}</p>
    <button class="btn mt" onclick="App.logout()">تسجيل الخروج</button><div class="powered">مدعوم بتقنية <b style="color:var(--green)">يقين AI</b></div></div></div>`;
}
let started = false;
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === "TOKEN_REFRESHED") { S.session = session; return; }
  if (ev === "PASSWORD_RECOVERY" || (ev === "INITIAL_SESSION" && /type=recovery/.test(location.hash))) {
    S.recovering = true; S.session = session; S.authTab = "reset"; started = true; setTimeout(() => renderAuth(), 0); return;
  }
  if (S.recovering && ev === "SIGNED_IN") return;
  if (ev === "INITIAL_SESSION" || ev === "SIGNED_IN" || ev === "SIGNED_OUT") {
    if (ev === "SIGNED_IN" && started && S.session?.user?.id === session?.user?.id) return;
    started = true; setTimeout(() => boot(session), 0);
  }
});
</script>
